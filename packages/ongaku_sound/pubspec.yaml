name: ongaku_sound
description: Ongaku's calibrated sound on Android - 10-band EQ, output detection, microphone measurement, test tones and live spectrum.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.orikami.ongaku.sound
        pluginClass: OngakuSoundPlugin
