name: Build Ongaku APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['**.md']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17.x'
      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: scripts/verify.sh
      # Debug-signed APK: installable for testing. Release signing needs your keystore secrets.
      - run: flutter build apk --debug --flavor github --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Ongaku-arm64-debug
          path: build/app/outputs/flutter-apk/*.apk
