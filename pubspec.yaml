name: musify
description: Music Streaming app made in Flutter!
homepage: https://github.com/gokadzev/Musify
repository: https://github.com/gokadzev/Musify
issue_tracker: https://github.com/gokadzev/Musify/issues

publish_to: 'none'
version: 10.5.3+185 # run update.sh after changing the version

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ^3.47.7

dependencies:
  app_links: ^7.2.2
  audio_metadata_reader: ^1.8.1 # Ongaku: local files
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.4
  crypto: ^3.0.7
  cupertino_ui: ^1.1.3 # Ongaku: iOS page transitions
  dbus: ^0.8.0
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  just_audio_media_kit:
    path: ./packages/just_audio_media_kit
  material_ui: ^1.7.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  ongaku_sound: # Ongaku: calibrated sound (local plugin)
    path: ./packages/ongaku_sound
  path_provider: ^2.1.6
  permission_handler: ^13.0.2 # Ongaku: local folders
  receive_sharing_intent:
    path: ./packages/receive_sharing_intent
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  youtube_explode_dart:
    path: ./packages/youtube_explode_dart
  youtube_music_explode_dart:
    path: ./packages/youtube_music_explode_dart
dev_dependencies:
  flutter_test:
    sdk: flutter

  just_audio_platform_interface: ^4.6.0
  media_kit: ^1.2.6

  # flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/licenses/
    - assets/icons/musify_icon.png
    # Ongaku: About page artwork.
    - assets/icons/ongaku_banner.png
    - assets/icons/musify_banner.png
    # Ongaku: theme icons, demo loop to compare a sound correction.
    - assets/icons/palettes/
    - assets/sounds/ongaku_demo.ogg

  fonts:
    - family: paytoneOne
      fonts:
        - asset: assets/fonts/paytone/PaytoneOne-Regular.ttf
    # --- Ongaku: Inter (SIL OFL, see assets/fonts/inter/OFL.txt) ---
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-800.ttf
          weight: 800
